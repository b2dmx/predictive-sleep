# Predictive Sleep card, built-in cards only.
# Add a Manual card to a dashboard and paste this in, then replace "sam" with the
# person's first name as it appears in their entity IDs (e.g. sensor.sam_predictive_sleep_...).
# Times show as clock times in your profile's format (format: time).
type: vertical-stack
cards:
  - type: heading
    heading: Sam's sleep
    icon: mdi:sleep
    badges:
      - type: entity
        entity: binary_sensor.sam_predictive_sleep_expected_asleep
        show_state: true
      - type: entity
        entity: binary_sensor.sam_predictive_sleep_wind_down
        show_state: true
  - type: entities
    entities:
      - type: section
        label: Tonight
      - entity: sensor.sam_predictive_sleep_next_bedtime
        name: Next bedtime
        format: time
      - entity: sensor.sam_predictive_sleep_next_wake_up
        name: Next wake-up
        format: time
      - type: section
        label: Last sleep
      - entity: sensor.sam_predictive_sleep_last_bedtime
        name: Bedtime
        format: time
      - entity: sensor.sam_predictive_sleep_last_wake_up
        name: Wake-up
        format: time
      - entity: sensor.sam_predictive_sleep_last_sleep_duration
        name: Duration
      - type: section
        label: Learning
      - entity: switch.sam_predictive_sleep_learning
        name: Learning
      - entity: sensor.sam_predictive_sleep_prediction_confidence
        name: Prediction confidence
      - entity: sensor.sam_predictive_sleep_prediction_error
        name: Prediction error
      - type: button
        name: Forget last sleep
        icon: mdi:delete-clock
        action_name: Forget
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.sam_predictive_sleep_forget_last_sleep
          confirmation:
            text: Forget the last recorded sleep?
  - type: statistics-graph
    title: Sleep duration
    days_to_show: 30
    chart_type: bar
    period: day
    stat_types:
      - max
    entities:
      - entity: sensor.sam_predictive_sleep_last_sleep_duration
        name: Hours slept
