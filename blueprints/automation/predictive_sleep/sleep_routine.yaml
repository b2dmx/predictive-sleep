blueprint:
  name: Predictive Sleep - Bedtime and wake-up routine
  description: >-
    Runs your own actions when someone (or the whole household) is expected asleep, and
    again when they are expected awake. Use it for locking up, closing blinds, turning on
    do-not-disturb, arming an alarm, lowering speaker volume, and undoing it all in the
    morning.
  domain: automation
  source_url: https://github.com/b2dmx/predictive-sleep/blob/main/blueprints/automation/predictive_sleep/sleep_routine.yaml
  input:
    expected_asleep:
      name: Expected asleep sensor
      description: A person's Expected asleep sensor, or the household's Everyone expected asleep.
      selector:
        entity:
          filter:
            - integration: predictive_bedtime
              domain: binary_sensor
    delay:
      name: Wait before bedtime actions
      description: Gives time to settle, and skips the actions if they get up again.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
    bedtime_actions:
      name: Bedtime actions
      default: []
      selector:
        action: {}
    wake_actions:
      name: Wake-up actions
      default: []
      selector:
        action: {}

mode: restart

triggers:
  - trigger: state
    entity_id: !input expected_asleep
    to: "on"
    for:
      minutes: !input delay
    id: asleep
  - trigger: state
    entity_id: !input expected_asleep
    from: "on"
    to: "off"
    id: awake

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: asleep
        sequence: !input bedtime_actions
      - conditions:
          - condition: trigger
            id: awake
        sequence: !input wake_actions
