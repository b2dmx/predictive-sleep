blueprint:
  name: Predictive Sleep - Pre-cool or pre-heat the bedroom
  description: >-
    Sets the bedroom climate ahead of the predicted bedtime, with enough lead time for the
    room to get there. Follows the prediction as it changes with shifts and habits.
  domain: automation
  source_url: https://github.com/b2dmx/predictive-sleep/blob/main/blueprints/automation/predictive_sleep/precondition_bedroom.yaml
  input:
    next_bedtime:
      name: Next bedtime
      description: A person's Next bedtime sensor, or the household's Earliest bedtime.
      selector:
        entity:
          filter:
            - integration: predictive_bedtime
              domain: sensor
              device_class: timestamp
    climate:
      name: Thermostat or air conditioner
      selector:
        entity:
          filter:
            - domain: climate
    temperature:
      name: Sleep temperature
      default: 19
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: "°"
    lead_minutes:
      name: Start this long before bedtime
      default: 45
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min

mode: single

trigger_variables:
  bedtime_entity: !input next_bedtime
  lead: !input lead_minutes

triggers:
  - trigger: template
    value_template: >-
      {% set bedtime = states(bedtime_entity) | as_datetime(none) %}
      {{ bedtime is not none
         and bedtime - timedelta(minutes=lead | int) <= now() < bedtime }}

actions:
  - action: climate.set_temperature
    target:
      entity_id: !input climate
    data:
      temperature: !input temperature
